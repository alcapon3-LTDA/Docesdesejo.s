*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html{background:var(--creme-fundo)}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  background:linear-gradient(180deg,#F7E8D4 0%,var(--creme) 40%,var(--creme-fundo) 100%);
  color:var(--tinta);font:400 16px/1.5 var(--sans);
}
h1,h2,h3{font-family:var(--serif);color:var(--cacau);margin:0;line-height:1.2}
p{margin:0}
button,input{font:inherit;color:inherit}
.ic{flex:none;display:block}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--rosa);outline-offset:3px}

/* ---------- topo ---------- */
.topo{position:relative;text-align:center;padding:clamp(44px,12vw,64px) 0 4px;pointer-events:none}
.topo .drip,.topo .swoosh{position:absolute;top:0;background-repeat:no-repeat;background-size:contain}
.topo .drip{left:0;width:clamp(104px,30vw,190px);aspect-ratio:345/285;background-image:var(--drip);background-position:left top}
.topo .swoosh{right:0;width:clamp(116px,33vw,210px);aspect-ratio:312/200;background-image:var(--swoosh);background-position:right top}
.topo .logo{display:block;margin:0 auto;width:clamp(190px,56vw,260px);height:auto}
body[data-tela=ficha] .topo{padding-top:clamp(74px,22vw,100px)}
body[data-tela=ficha] .topo .logo{display:none}
body[data-dono] .topo{padding-top:clamp(20px,6vw,30px)}
body[data-dono] .topo .drip{width:clamp(70px,20vw,110px)}
body[data-dono] .topo .swoosh{width:clamp(76px,22vw,120px)}
body[data-dono] .topo .logo{width:clamp(120px,34vw,150px)}

.miolo{max-width:480px;margin:0 auto;padding:8px 18px 132px}
body[data-dono] .miolo{max-width:720px}
.tela>h1{font-size:clamp(25px,7vw,31px);font-weight:700;text-align:center;letter-spacing:-.01em;text-wrap:balance}
.tela>h1:focus{outline:none}
.sub{text-wrap:balance;text-align:center;font:italic 500 18px/1.45 var(--serif);color:var(--chocolate);margin:8px auto 0;max-width:34ch}
.brinde{display:flex;justify-content:center;margin:16px 0 4px}
.brinde .pilula{display:inline-flex;align-items:center;gap:8px;background:var(--rosa-claro);border:1.5px solid var(--ouro-linha);border-radius:999px;padding:8px 16px;font:500 15px/1.3 var(--sans);color:var(--cacau);text-align:left}
.brinde b{font-family:var(--serif);font-weight:700}
.brinde .ic{color:var(--rosa-texto)}

/* ---------- botões ---------- */
.btn{appearance:none;border:0;cursor:pointer;font:700 16px/1.1 var(--sans);min-height:52px;padding:0 22px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;transition:transform .08s,box-shadow .08s}
.btn-prim{background:var(--chocolate);color:var(--papel);box-shadow:0 3px 0 var(--cacau)}
.btn-prim:active{transform:translateY(2px);box-shadow:0 1px 0 var(--cacau)}
.btn-rosa{background:var(--rosa);color:var(--cacau);box-shadow:0 3px 0 #B9404C}
.btn-rosa:active{transform:translateY(2px);box-shadow:0 1px 0 #B9404C}
.btn-sec{background:transparent;color:var(--cacau);border:2px solid var(--ouro-linha)}
.btn-perigo{background:transparent;color:var(--erro);border:2px solid var(--erro)}
.btn-cheio-perigo{background:var(--erro);color:#fff}
.btn-mini{min-height:44px;padding:0 16px;font-size:14px;border-radius:12px}
.btn-txt{background:none;border:0;color:var(--rosa-texto);text-decoration:underline;font:500 15px/1.2 var(--sans);min-height:44px;padding:0 10px;cursor:pointer}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn-bloco{width:100%}
.linha-btn{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.linha-btn>*{flex:1 1 auto}
.linha-btn .btn{white-space:nowrap;padding:0 16px}

/* ---------- campos ---------- */
.campo{display:block;margin:0 0 18px}
.campo>span{display:block;font:500 13px/1.2 var(--sans);color:var(--ouro-texto);margin-bottom:2px}
.campo input[type=text],.campo input[type=tel],.campo input[type=password],.campo input[type=search]{
  width:100%;border:0;border-bottom:2px solid var(--ouro-linha);background:transparent;border-radius:0;
  padding:6px 0 8px;font:500 21px/1.3 var(--serif);color:var(--cacau);outline:0}
.campo input::placeholder{color:#7B6A5C;opacity:1;font-style:italic}
.campo input:focus-visible{border-bottom-color:var(--rosa);box-shadow:0 2px 0 0 var(--rosa)}
.campo input[aria-invalid=true]{border-bottom-color:var(--erro)}
.erro{color:var(--erro);font:500 13px/1.35 var(--sans);margin-top:6px}
.erro:empty{display:none}
.dica{font:400 13px/1.45 var(--sans);color:#5A4636}
.aceite{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font:400 13.5px/1.45 var(--sans);color:var(--tinta);margin:2px 0 4px}
.aceite input{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin:0;border:2px solid var(--ouro);border-radius:7px;background:var(--papel);display:grid;place-content:center;cursor:pointer}
.aceite input:checked{background:var(--chocolate);border-color:var(--chocolate)}
.aceite input:checked::after{content:"";width:12px;height:7px;border:solid var(--papel);border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px)}
.qtd{display:flex;align-items:center;gap:6px}
.qtd button{width:44px;height:44px;border-radius:50%;border:2px solid var(--ouro-linha);background:var(--papel);color:var(--cacau);display:grid;place-items:center;cursor:pointer}
.qtd button:active{background:var(--rosa-claro)}
.qtd output{min-width:52px;text-align:center;font:700 28px/1 var(--serif);color:var(--cacau)}
.qtd small{font:400 13px/1.3 var(--sans);color:#5A4636;margin-left:6px}

/* ---------- a ficha (o elemento marcante) ---------- */
.ficha-wrap{margin:22px auto 0;max-width:420px;filter:drop-shadow(0 10px 14px rgba(92,41,9,.2))}
.ficha{
  --r:14px;--h:136px;
  position:relative;background:var(--papel);border:1.5px solid var(--ouro-linha);border-radius:18px;
  -webkit-mask:radial-gradient(circle var(--r) at 0 calc(100% - var(--h) - 1.5px),#0000 96%,#000),radial-gradient(circle var(--r) at 100% calc(100% - var(--h) - 1.5px),#0000 96%,#000);
  -webkit-mask-composite:source-in;
  mask:radial-gradient(circle var(--r) at 0 calc(100% - var(--h) - 1.5px),#0000 96%,#000),radial-gradient(circle var(--r) at 100% calc(100% - var(--h) - 1.5px),#0000 96%,#000);
  mask-composite:intersect;
}
.ficha-corpo{padding:20px 22px 22px;position:relative}
.ficha-logo{display:block;width:150px;height:auto;margin:0 auto 14px}
.ficha-corte{position:absolute;left:18px;right:18px;bottom:var(--h);border-top:2px dashed var(--ouro-linha);height:0}
.ficha-corte .ic{position:absolute;left:2px;top:-9px;color:var(--ouro);background:var(--papel);padding:0 4px;box-sizing:content-box}
.ficha-canhoto{height:var(--h);background:var(--rosa-claro);border-radius:0 0 16px 16px;padding:14px 18px 16px;display:flex;flex-direction:column;justify-content:center}
.ficha-canhoto .rot{font:500 13px/1.2 var(--sans);color:var(--ouro-texto);text-align:center;margin-bottom:2px}
.ficha-canhoto .num{font:700 clamp(44px,13vw,56px)/1 var(--serif);color:var(--cacau);text-align:center;letter-spacing:.02em}
.ficha-canhoto .num.duplo{font-size:clamp(30px,9vw,38px)}
.ficha-dados{margin:0;display:grid;gap:12px}
.ficha-dados div{border-bottom:1.5px solid var(--ouro-linha);padding-bottom:6px}
.ficha-dados dt{font:500 13px/1.2 var(--sans);color:var(--ouro-texto)}
.ficha-dados dd{margin:2px 0 0;font:500 21px/1.3 var(--serif);color:var(--cacau);overflow-wrap:anywhere}
.selo{position:absolute;top:12px;right:12px;display:inline-flex;align-items:center;gap:6px;background:var(--rosa);color:var(--cacau);font:700 12px/1 var(--sans);padding:7px 11px;border-radius:999px;transform:rotate(4deg)}
.sorteada .ficha-logo{margin-top:18px}
/* estado de formulário: o canhoto guarda o botão */
.ficha-form .ficha-canhoto{gap:10px}
.ficha-form .prox{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:500 13px/1.2 var(--sans);color:var(--ouro-texto)}
.ficha-form .prox b{font:700 clamp(21px,6.6vw,26px)/1 var(--serif);color:var(--cacau);letter-spacing:.02em;white-space:nowrap}
.carimbo .ficha-canhoto .num{animation:carimbo .5s cubic-bezier(.2,1.4,.4,1) both .15s}
@keyframes carimbo{from{transform:scale(1.7) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}

.pos-ficha{max-width:420px;margin:20px auto 0}
.pos-ficha .aviso-total{text-align:center;font:500 15px/1.45 var(--sans);color:var(--cacau);margin-bottom:6px}
.encerrado{max-width:420px;margin:28px auto 0;text-align:center;background:var(--papel);border:1.5px solid var(--ouro-linha);border-radius:18px;padding:26px 22px}
.encerrado p{margin-top:8px}

/* ---------- rodapé e avisos ---------- */
.rodape{max-width:480px;margin:34px auto 0;text-align:center;font:italic 500 16px/1.4 var(--serif);color:var(--chocolate)}
.rodape small{display:block;font:400 13px/1.5 var(--sans);color:#5A4636;margin-top:6px}
.rodape .dono{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font:500 14px/1 var(--sans);font-style:normal;color:var(--cacau);text-decoration:none;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--ouro-linha);background:transparent;cursor:pointer}
.faixa{background:var(--erro);color:#fff;font:500 14px/1.4 var(--sans);padding:10px 16px;text-align:center}
.faixa[hidden]{display:none}
.faixa.aviso{background:var(--ouro-texto)}
.estado{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px;font:400 14px/1.4 var(--sans)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--cacau);color:var(--papel);font:500 14px/1.35 var(--sans);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- abas do dono ---------- */
.abas{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--chocolate);display:flex;justify-content:center;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(56,23,3,.25)}
.abas[hidden]{display:none}
.aba{flex:1;min-width:0;max-width:130px;min-height:54px;background:none;border:0;border-radius:12px;color:var(--rosa-claro);display:grid;justify-items:center;align-content:center;gap:3px;font:500 11.5px/1.1 var(--sans);cursor:pointer;padding:0 1px}
.aba[aria-current=page]{background:rgba(255,210,204,.18);color:#fff}

/* ---------- área do dono ---------- */
.cartao{background:var(--papel);border:1.5px solid var(--ouro-linha);border-radius:18px;padding:18px}
.cartao+.cartao,.cartao+.bloco,.bloco+.cartao{margin-top:14px}
.bloco{margin-top:18px}
.bloco>h2{font-size:20px;margin-bottom:10px}
.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
.resumo div{background:var(--papel);border:1.5px solid var(--ouro-linha);border-radius:14px;padding:12px 10px;text-align:center}
.resumo b{display:block;font:700 30px/1.1 var(--serif);color:var(--cacau)}
.resumo span{font:500 12.5px/1.25 var(--sans);color:#5A4636}
.vazio{text-align:center;padding:26px 12px;color:#5A4636;font:500 15px/1.5 var(--sans)}
.vazio b{display:block;font:700 19px/1.3 var(--serif);color:var(--cacau);margin-bottom:4px}

.palco{margin-top:18px;background:radial-gradient(120% 90% at 50% 0%,#7B3A12 0%,var(--chocolate) 48%,var(--cacau) 100%);border:2px solid var(--ouro-linha);border-radius:22px;padding:22px 12px 18px;text-align:center;color:var(--papel);box-shadow:inset 0 0 0 6px rgba(215,167,121,.16)}
.palco p{font:italic 500 17px/1.4 var(--serif);color:var(--rosa-claro);min-height:24px}
.rolos{display:flex;justify-content:center;gap:8px;margin:14px 0 14px}
.rolo{width:clamp(48px,16vw,76px);height:clamp(72px,23vw,108px);background:var(--papel);color:var(--cacau);border-radius:12px;display:grid;place-items:center;font:700 clamp(46px,15vw,80px)/1 var(--serif);box-shadow:inset 0 -12px 16px rgba(56,23,3,.16),0 3px 0 var(--ouro)}
.rolo.pousou{animation:pouso .32s cubic-bezier(.2,1.6,.4,1)}
@keyframes pouso{from{transform:translateY(-10px) scale(1.06)}to{transform:none}}
.palco .btn{margin-top:4px;min-width:min(100%,260px)}
.ganhador{margin-top:18px}
.ganhador .brinde-ganho{text-align:center;font:500 16px/1.4 var(--sans);margin-top:16px}
.ganhador .brinde-ganho b{font:700 19px/1.3 var(--serif)}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.hist li{background:var(--papel);border:1.5px solid var(--ouro-linha);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.hist .topo-item{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hist .nf{font:700 22px/1 var(--serif);color:var(--cacau)}
.hist .nome{font:500 15px/1.35 var(--sans);overflow-wrap:anywhere}
.hist .meta{font:400 13px/1.4 var(--sans);color:#5A4636}
.hist .acoes{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.etq{display:inline-block;font:700 11.5px/1 var(--sans);padding:5px 9px;border-radius:999px;background:var(--rosa-claro);color:var(--cacau)}
.etq.aus{background:#E9D3C0;color:#5A4636}
.hist .aus-item{opacity:.8}
.link-wa{display:inline-flex;align-items:center;gap:8px;min-height:44px;font:700 14px/1 var(--sans);color:var(--cacau);background:var(--rosa-claro);padding:0 14px;border-radius:12px;text-decoration:none}

.busca{margin:16px 0 4px;position:relative}
.busca input{width:100%;min-height:50px;border:2px solid var(--ouro-linha);background:var(--papel);border-radius:14px;padding:0 16px 0 44px;font:500 17px/1 var(--sans);color:var(--cacau)}
.busca input:focus-visible{outline:0;border-color:var(--rosa);box-shadow:0 0 0 3px rgba(233,93,105,.25)}
.busca .ic{position:absolute;left:14px;top:14px;color:var(--ouro-texto)}
.pessoas{display:grid;gap:12px;margin-top:14px}
.pessoa{background:var(--papel);border:1.5px solid var(--ouro-linha);border-radius:16px;padding:14px 16px}
.pessoa header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pessoa strong{display:block;font:700 19px/1.25 var(--serif);color:var(--cacau);overflow-wrap:anywhere}
.pessoa .tel{font:400 14px/1.4 var(--sans);color:#5A4636}
.pessoa .cont{font:700 13px/1 var(--sans);background:var(--rosa-claro);padding:6px 10px;border-radius:999px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.chip{display:inline-flex;align-items:center;background:var(--rosa-claro);color:var(--cacau);border-radius:999px;padding:0 4px 0 13px;min-height:36px;font:700 15px/1 var(--serif)}
.chip button{width:32px;height:32px;border:0;background:none;color:var(--rosa-texto);border-radius:50%;display:grid;place-items:center;cursor:pointer}
.chip.gan{background:var(--rosa);padding-right:13px;gap:6px}
.acoes-p{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}

.trilha{display:grid;gap:12px}
.troca{display:flex;align-items:center;justify-content:space-between;gap:14px;background:transparent;border:0;width:100%;text-align:left;cursor:pointer;padding:6px 0;min-height:52px}
.troca .tx b{display:block;font:500 16px/1.3 var(--sans);color:var(--cacau)}
.troca .tx span{display:block;font:400 13px/1.4 var(--sans);color:#5A4636;margin-top:2px}
.chave{flex:none;width:52px;height:30px;border-radius:999px;background:#CDB79F;position:relative;transition:background .15s}
.chave::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.troca[aria-checked=true] .chave{background:var(--chocolate)}
.troca[aria-checked=true] .chave::after{transform:translateX(22px)}
.pin-caixa{max-width:380px;margin:22px auto 0}
.pin-caixa .campo input{text-align:center;letter-spacing:.35em;font-size:28px}
.codigo{font:700 34px/1.2 var(--serif);text-align:center;letter-spacing:.12em;color:var(--cacau);background:var(--rosa-claro);border-radius:14px;padding:14px 8px;margin:14px 0}

/* ---------- compras e filipeta ---------- */
.vezes{text-align:center;min-width:64px}
.vezes b{display:block;font:700 32px/1 var(--serif);color:var(--cacau)}
.vezes span{font:500 12px/1.2 var(--sans);color:#5A4636}
.barra{height:12px;border-radius:999px;background:#EBD5BC;overflow:hidden;margin:12px 0 6px}
.barra span{display:block;height:100%;background:var(--rosa);border-radius:inherit}
.barra.cheia span{background:var(--ouro)}
.fid-txt{font:500 14px/1.4 var(--sans);color:var(--cacau)}
.fp-palco{margin-top:18px}
.filipeta{--u:3.48px;position:relative;width:min(100%,348px);aspect-ratio:92/128;margin:0 auto;background:var(--papel);border:1.5px dashed var(--ouro-linha);border-radius:14px;overflow:hidden;box-shadow:0 10px 24px rgba(92,41,9,.16)}
.fp-drip,.fp-swoosh{position:absolute;top:0;background-repeat:no-repeat;background-size:contain}
.fp-drip{left:0;width:calc(var(--u) * 26);aspect-ratio:345/285;background-image:var(--drip);background-position:left top}
.fp-swoosh{right:0;width:calc(var(--u) * 28);aspect-ratio:312/200;background-image:var(--swoosh);background-position:right top}
.fp-in{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(var(--u) * 9) calc(var(--u) * 8) calc(var(--u) * 5)}
.fp-logo{width:calc(var(--u) * 42);height:auto;display:block}
.fp-titulo{font:700 calc(var(--u) * 5.8)/1.22 var(--serif);color:var(--cacau);margin-top:calc(var(--u) * 4);text-wrap:balance}
.fp-sub{font:italic 500 calc(var(--u) * 3.9)/1.35 var(--serif);color:var(--chocolate);margin-top:calc(var(--u) * 3)}
.fp-rot{font:500 calc(var(--u) * 3.2)/1.2 var(--sans);color:var(--ouro-texto);margin-top:calc(var(--u) * 4)}
.fp-cartela{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u) * 2.6);margin-top:calc(var(--u) * 2);width:100%}
.fp-c{width:calc((100% - (var(--cols) - 1) * calc(var(--u) * 2.6)) / var(--cols));aspect-ratio:1;border:calc(var(--u) * .5) dashed var(--ouro);border-radius:50%;display:grid;place-items:center;font:700 calc(var(--u) * 4.6)/1 var(--serif);color:var(--ouro-texto);background:#fff}
.fp-c.premio{background:var(--rosa);border-color:var(--rosa);color:var(--cacau)}
.fp-c .ic{width:52%;height:52%}
.fp-pe{margin-top:auto;font:400 calc(var(--u) * 3.1)/1.4 var(--sans);color:#5A4636}

/* ---------- sms ---------- */
.campo textarea{width:100%;border:2px solid var(--ouro-linha);border-radius:12px;background:var(--papel);padding:10px 12px;font:500 17px/1.45 var(--serif);color:var(--cacau);resize:vertical;min-height:84px}
.campo textarea:focus-visible{outline:0;border-color:var(--rosa);box-shadow:0 0 0 3px rgba(233,93,105,.25)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.filtro{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--ouro-linha);background:transparent;color:var(--cacau);font:500 14px/1 var(--sans);cursor:pointer}
.filtro[aria-pressed=true]{background:var(--chocolate);border-color:var(--chocolate);color:var(--papel)}
.etq.pend{background:var(--rosa);color:var(--cacau)}
.hist .acoes+.acoes{margin-top:-2px}
.aba{position:relative}
.aba .nb{position:absolute;top:2px;left:calc(50% + 4px);min-width:18px;height:18px;border-radius:9px;background:var(--rosa);color:var(--cacau);font:700 11px/18px var(--sans);text-align:center;padding:0 4px}
.travar{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:35;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ouro-linha);background:var(--papel);color:var(--cacau);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(56,23,3,.2)}
.travar[hidden]{display:none}
.faixa{padding-left:16px;padding-right:64px}

/* ---------- diálogo ---------- */
dialog{border:0;border-radius:20px;padding:0;background:var(--papel);color:var(--tinta);max-width:min(92vw,400px);width:100%;box-shadow:0 20px 50px rgba(56,23,3,.45)}
dialog::backdrop{background:rgba(56,23,3,.55)}
.dlg{padding:22px}
.dlg h2{font-size:22px}
.dlg p{margin-top:8px;font:400 15px/1.5 var(--sans)}
.dlg .acoes{display:flex;gap:10px;margin-top:18px}
.dlg .acoes .btn{flex:1}

#confete{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#impressao{display:none}

@media (min-width:900px){
  .topo .drip{width:220px}.topo .swoosh{width:250px}
  body[data-dono] .topo .drip{width:130px}body[data-dono] .topo .swoosh{width:140px}
}
@media (max-width:359px){.aba{font-size:10px;letter-spacing:-.01em}.abas{gap:0;padding-left:2px;padding-right:2px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media print{
  @page{margin:10mm}
  body{background:#fff!important}
  body>*:not(#impressao){display:none!important}
  #impressao{display:grid;grid-template-columns:repeat(2,1fr);gap:8mm}
  #impressao .ficha-wrap{margin:0;filter:none;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #impressao.fp{grid-template-columns:repeat(2,92mm);gap:6mm;justify-content:center}
  #impressao .filipeta{width:92mm;--u:calc(92mm / 100) !important;box-shadow:none;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #impressao .filipeta *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

  t.onsuccess = () => { db.close(); res(t.result || null); }; t.onerror = () => { db.close(); rej(t.error); };
}));
const idbGravar = txt => idbAbrir().then(db => new Promise((res, rej) => {
  const tx = db.transaction(IDB.loja, 'readwrite'); tx.objectStore(IDB.loja).put(txt, 'estado');
  tx.oncomplete = () => { db.close(); res(); }; tx.onerror = () => { db.close(); rej(tx.error); }; tx.onabort = () => { db.close(); rej(tx.error); };
}));
function gravar() {
  S.upd = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); salvo = true; }
  catch (e) { salvo = false; }
  if (idbPronto) idbGravar(JSON.stringify(S)).then(() => { if (!salvo) { salvo = true; avisos(); } }).catch(() => {});
  avisos();
}
async function reconciliar() {
  try {
    const txt = await idbLer();
    if (txt) {
      const o = JSON.parse(txt), m = normalizar(o), tem = x => x.fichas.length || x.seq || x.ganhadores.length;
      if (tem(m) && (!tem(S) || m.upd > S.upd)) {
        S = m; try { localStorage.setItem(KEY, JSON.stringify(S)); salvo = true; } catch (e) {}
        idbPronto = true; render(); toast('Recuperei seus dados guardados neste aparelho.');
      }
    }
  } catch (e) {}
  idbPronto = true;
  try { await idbGravar(JSON.stringify(S)); } catch (e) {}
  if (!salvo) { try { await idbLer().then(t => { if (t) { salvo = true; avisos(); } }); } catch (e) {} }
}

function pedirPersistencia() { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(v => { persistente = v; }).catch(() => {}); } catch (e) {} }

const fmtTel = d => d.length === 11 ? `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}` : d.length === 10 ? `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}` : d;
const maskTel = d => d.length === 11 ? `(${d.slice(0,2)}) ${d[2]}••••-${d.slice(7)}` : fmtTel(d);

const primeiro = n => (n.trim().split(/\s+/)[0] || '');
const soDig = s => String(s).replace(/\D/g, '');
function rand(n) {
  if (n <= 1) return 0;
  const c = window.crypto;
  if (c && c.getRandomValues) {
    const max = Math.floor(4294967296 / n) * n, a = new Uint32Array(1);
    do { c.getRandomValues(a); } while (a[0] >= max);
    return a[0] % n;
  }
  return Math.floor(Math.random() * n);
}
function hash(str) {
  str = 'dd:' + str;
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

const smsHref = (tel, nome) => `sms:+55${tel}?&body=${encodeURIComponent(mensagemSms(nome))}`;
const GSM = "@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ !\"#¤%&'()*+,-./0123456789:;<=>?¡ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÑÜ§¿abcdefghijklmnopqrstuvwxyzäöñüà";
function partesSms(t) {
  let len = 0, gsm = true;
  for (const ch of t) { if (GSM.includes(ch)) len++; else if ('^{}\\[~]|€'.includes(ch)) len += 2; else { gsm = false; break; } }
  if (gsm) return {gsm:true, len, partes:len <= 160 ? 1 : Math.ceil(len / 153)};
  const l = [...t].length; return {gsm:false, len:l, partes:l <= 70 ? 1 : Math.ceil(l / 67)};
}

function pessoas() {
  const m = new Map();
  for (const f of S.fichas) {
    let p = m.get(f.tel);
    if (!p) { p = {tel:f.tel, nome:f.nome, fichas:[], ult:0}; m.set(f.tel, p); }
    p.fichas.push(f); p.ult = Math.max(p.ult, f.ts);
  }
  return [...m.values()];
}
const totalDe = tel => S.fichas.filter(f => f.tel === tel).length;
function elegiveis() {
  const gt = new Set(S.ganhadores.map(g => g.tel)), gn = new Set(S.ganhadores.map(g => g.n));
  return S.fichas.filter(f => S.cfg.repete ? !gn.has(f.n) : !gt.has(f.tel));
}
function addFichas(nome, tel, qtd) {
  const ns = [], ts = Date.now();
  for (let i = 0; i < qtd; i++) { const n = ++S.seq; S.fichas.push({n, nome, tel, ts}); ns.push(n); }
  const e = {id:uid(), tel, nome, ts, ns:ns.slice(0, 60), status:'pendente', env:0, canal:'sms'};
  S.sms.push(e); ns.smsId = e.id;
  gravar();
  return ns;
}

function fidStatus(tel, total) {

  return {total, ent, prog, pend, falta:meta - (prog % meta)};
}

function resumoCompras() {
  const pp = pessoas(); let pend = 0;
  pp.forEach(p => { pend += fidStatus(p.tel, p.fichas.length).pend; });
  return `<div><b>${pp.length}</b><span>clientes</span></div>
      <div><b>${S.fichas.length}</b><span>compras no total</span></div>
      <div><b>${pend}</b><span>${pend === 1 ? 'brinde para entregar' : 'brindes para entregar'}</span></div>`;
}
function listaCompras() {
  const q = buscaC.trim().toLowerCase(), qd = soDig(buscaC);
  const lista = pessoas().filter(p => !q || p.nome.toLowerCase().includes(q) || (qd && p.tel.includes(qd)))
    .map(p => ({p, st:fidStatus(p.tel, p.fichas.length)}))
    .sort((a, b) => (b.st.pend > 0) - (a.st.pend > 0) || b.p.fichas.length - a.p.fichas.length || a.p.nome.localeCompare(b.p.nome, 'pt-BR'));
  if (!S.fichas.length) return `<p class="vazio"><b>Nenhuma compra ainda</b>Quando você registrar compras, a contagem de cada cliente aparece aqui.</p>`;
  if (!lista.length) return `<p class="vazio"><b>Ninguém encontrado</b>Tente outro nome ou WhatsApp.</p>`;
  const meta = S.cfg.meta;
  return lista.map(({p, st}) => {
    const pct = st.pend > 0 ? 100 : Math.round(st.prog / meta * 100);
    const txt = st.pend > 0 ? (st.pend > 1 ? `${st.pend} brindes conquistados` : 'Brinde conquistado!') : `Faltam ${st.falta} para o brinde`;
    return `<article class="pessoa" data-tel="${p.tel}">
      <header><div><strong>${esc(p.nome)}</strong><span class="tel">${esc(fmtTel(p.tel))}</span></div>
        <div class="vezes"><b>${p.fichas.length}</b><span>${p.fichas.length === 1 ? 'compra' : 'compras'}</span></div></header>
      <div class="barra${st.pend > 0 ? ' cheia' : ''}" role="progressbar" aria-label="Progresso para o brinde" aria-valuemin="0" aria-valuemax="${meta}" aria-valuenow="${Math.min(meta, st.prog)}"><span style="width:${pct}%"></span></div>
      <p class="fid-txt">${txt}${st.ent ? ` · já recebeu ${plural(st.ent, 'brinde', 'brindes')}` : ''}</p>
      <div class="acoes-p">
        ${st.pend > 0 ? `<button class="btn btn-rosa btn-mini" data-act="entregar">Entregar brinde</button><a class="link-wa" target="_blank" rel="noopener" href="${waHref(p.tel, `Oi, ${primeiro(p.nome)}! Você completou ${meta} compras na Doces Desejo’s e ganhou um brinde à sua escolha! Passe aqui para retirar.`)}">${ic('chat', 18)} Avisar no WhatsApp</a>` : ''}
        ${st.ent ? '<button class="btn-txt" data-act="desfazer-entrega">Desfazer última entrega</button>' : ''}
      </div></article>`;
  }).join('');
}

async function copiar(txt) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(txt); return true; } } catch (e) {}
  try { const t = document.createElement('textarea'); t.value = txt; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); return ok; } catch (e) { return false; }
}
async function voltou() {
  if (!smsAguardando || !saiu || confirmandoSms) return;
  const a = smsAguardando; smsAguardando = null; saiu = false;
  if (Date.now() - a.ts > 30 * 60 * 1000) return;
  const e = S.sms.find(x => x.id === a.id); if (!e) return;
  confirmandoSms = true;
  const sim = await confirmar(`Você enviou ${a.canal === 'whatsapp' ? 'a mensagem' : 'o SMS'} para ${primeiro(e.nome)}?`, 'Se enviou, eu marco como enviado. Se não, continua na fila.', 'Sim, enviei', false, 'Ainda não');
  confirmandoSms = false;
  if (sim) { e.status = 'enviado'; e.env = Date.now(); e.canal = a.canal; gravar(); toast('Marcado como enviado.'); refrescarSms(); }
}

function rodape() {
  const r = $('#rodape'), t = document.body.dataset.tela;
  const salvoTxt = salvo ? 'Dados salvos neste aparelho.' : 'Atenção: os dados desta sessão não estão sendo salvos.';
  r.innerHTML = `Feito com amor, para adoçar seus dias.<small>@doces.desejos_14 · ${salvoTxt}</small>` +
    (!aberto && !DONO.has(t) && t !== 'pin' ? `<div><button class="dono" data-act="dono">${ic('lock', 16)} Área da doceria</button></div>` : '');
}
function abas() {
  const n = $('#abas'), t = document.body.dataset.tela;
  n.hidden = !aberto || t === 'pin';
  $('#btnTravar').hidden = n.hidden;
  if (n.hidden) return;
  const itens = [['', 'Registrar', 'ticket'], ['sorteio', 'Sorteio', 'gift'], ['fichas', 'Fichas', 'list'], ['compras', 'Compras', 'repeat'], ['sms', 'SMS', 'chat'], ['ajustes', 'Ajustes', 'sliders']];
  const atual = t === 'ficha' ? '' : t === 'filipeta' ? 'compras' : t;
  const pend = S.sms.filter(x => x.status === 'pendente').length;
  n.innerHTML = itens.map(([r, l, i]) => `<button class="aba" data-ir="${r}" ${atual === r ? 'aria-current="page"' : ''}>${ic(i, 22)}${r === 'sms' && pend ? `<b class="nb" aria-label="${pend} pendentes">${pend > 99 ? '99+' : pend}</b>` : ''}<span>${l}</span></button>`).join('');
}
function avisos() {
  const f = $('#faixa');
  f.hidden = salvo;
  if (!salvo) f.textContent = 'Este navegador não deixa salvar dados. Abra o arquivo direto no Chrome ou Safari. Enquanto isso, baixe o backup em Ajustes.';
  const bk = $('#faixaBk');
  if (bk) {
    const dias = S.cfg.ub ? Math.floor((Date.now() - S.cfg.ub) / 864e5) : null;
    const precisa = aberto && DONO.has(rota()) && S.fichas.length > 0 && (dias === null || dias >= 7);
    bk.hidden = !precisa;
    if (precisa) bk.innerHTML = `${dias === null ? 'Você ainda não fez backup dos seus dados.' : `Faz ${plural(dias, 'dia', 'dias')} que você não faz backup.`} <button class="btn-txt" data-act="backup-agora" style="color:#fff;min-height:36px">Fazer backup agora</button>`;
  }
  const rt = $('#rodape'); if (rt && rt.innerHTML) rodape();
}
let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2800); }

/* ---------- diálogo ---------- */
function confirmar(titulo, texto, ok = 'Confirmar', perigo = false, cancelar = 'Cancelar') {
  const d = $('#dlg');
  if (!d.showModal) return Promise.resolve(window.confirm(titulo + '\n' + texto));
  return new Promise(res => {
    d.innerHTML = `<form method="dialog" class="dlg"><h2 id="dlgTitulo">${esc(titulo)}</h2><p>${esc(texto)}</p>
      <div class="acoes"><button class="btn btn-sec" value="nao">${esc(cancelar)}</button><button class="btn ${perigo ? 'btn-cheio-perigo' : 'btn-prim'}" value="sim">${esc(ok)}</button></div></form>`;
    d.returnValue = '';
    d.addEventListener('close', () => res(d.returnValue === 'sim'), {once:true});
    d.showModal();
  });
}

function falha(e) {

function rolar(alvo) {
  const els = $$('.rolo');
  if (reduz()) { els.forEach((e, i) => e.textContent = alvo[i]); return Promise.resolve(); }
  return new Promise(fim => {
    const t0 = performance.now(), parar = els.map((_, i) => 1700 + i * 800), feito = els.map(() => false);
    let ult = 0;
    const passo = t => {
      const dt = t - t0, tick = t - ult > 55; let todos = true;
      els.forEach((e, i) => {
        if (feito[i]) return;
        if (dt >= parar[i]) { e.textContent = alvo[i]; e.classList.add('pousou'); feito[i] = true; }
        else { todos = false; if (tick) e.textContent = String(rand(10)); }
      });
      if (tick) ult = t;
      if (todos) fim(); else requestAnimationFrame(passo);
    };
    requestAnimationFrame(passo);
  });
}

     <div class="linha-btn" style="max-width:420px;margin:12px auto 0"><a class="link-wa btn-bloco" style="justify-content:center" target="_blank" rel="noopener" href="https://wa.me/55${g.tel}?text=${encodeURIComponent(msg)}">${ic('chat', 18)} Avisar no WhatsApp</a></div>`;

let confeteRaf = 0;

  const cv = $('#confete'), x = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cores = ['#E95D69', '#FFD2CC', '#B0771C', '#D7A779', '#5C2909', '#FFF8EE'];
  const box = ($('.palco') || cv).getBoundingClientRect(), cx = box.left + box.width / 2, cy = Math.max(120, box.top + box.height / 2);
  const ps = Array.from({length:130}, () => {

    return {x:cx, y:cy, vx:Math.cos(ang) * v, vy:Math.sin(ang) * v, s:5 + Math.random() * 7, r:Math.random() * 6, vr:(Math.random() - .5) * .4, c:cores[rand(cores.length)], f:rand(3)};
  });

      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = Math.max(0, 1 - Math.max(0, dt - 2400) / 1300); x.fillStyle = p.c;

}

async function baixar(nome, conteudo, tipo) {
  const b = conteudo instanceof Blob ? conteudo : new Blob([conteudo], {type:tipo});
  if (window.claude && typeof window.claude.use === 'function') {
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({filename:nome, data:b}); return true; }
      catch (e) { if (e && e.code === 'declined') return false; toast('Não foi possível salvar o arquivo aqui.'); return false; }
    }
  }
  const u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 5000);
  return true;
}
function csv() {
  const gn = new Set(S.ganhadores.filter(g => g.status !== 'ausente').map(g => g.n));
  const linhas = [['Ficha', 'Nome', 'WhatsApp', 'Registrada em', 'Sorteada']];
  S.fichas.forEach(f => linhas.push([fmtN(f.n), f.nome, fmtTel(f.tel), fmtData(f.ts), gn.has(f.n) ? 'Sim' : '']));
  const q = v => { v = String(v); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  return '\ufeff' + linhas.map(l => l.map(q).join(';')).join('\r\n');
}
$('#arquivo').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    let o; try { o = JSON.parse(rd.result); } catch (err) { toast('Arquivo inválido.'); return; }
    if (!o || (!Array.isArray(o.fichas) && !extrairFichas(o))) { toast('Este arquivo não é um backup do sorteio.'); return; }
    const n = normalizar(o);
    if (!n.fichas.length) { const l = extrairFichas(o); if (l) { n.fichas = l; n.seq = Math.max(...l.map(f => f.n)); } }
    if (await confirmar('Restaurar este backup?', `Vai trocar os dados atuais por ${plural(n.fichas.length, 'ficha', 'fichas')} e ${plural(n.ganhadores.length, 'ganhador', 'ganhadores')}.`, 'Restaurar')) {
      try { localStorage.setItem(KEY + '-antes', JSON.stringify(S)); } catch (x) {}
      n.cfg.pin = S.cfg.pin; n.cfg.rec = S.cfg.rec; n.cfg.ub = S.cfg.ub; S = n; gravar(); ultimo = null; toast('Backup restaurado.'); render();
    }
  };
  rd.readAsText(f);
});

/* ---------- imagem e impressão ---------- */
function rr(x, px, py, w, h, r) { x.beginPath(); x.moveTo(px + r, py); x.arcTo(px + w, py, px + w, py + h, r); x.arcTo(px + w, py + h, px, py + h, r); x.arcTo(px, py + h, px, py, r); x.arcTo(px, py, px + w, py, r); x.closePath(); }
function ajustar(x, txt, fonte, max, ini, min) { let s = ini; do { x.font = fonte.replace('#', s); if (x.measureText(txt).width <= max) break; s -= 2; } while (s > min); return s; }
async function desenhar(u) {
  try { await Promise.all([document.fonts.load('700 100px Lora'), document.fonts.load('500 40px Lora'), document.fonts.load('500 24px Poppins'), document.fonts.load('400 24px Poppins')]); } catch (e) {}
  const img = new Image(); img.src = LOGO; try { await img.decode(); } catch (e) {}
  const W = 760, H = 1060, P = 40, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), tx = P, ty = P, tw = W - 2 * P, th = H - 2 * P, sh = 280, cy = ty + th - sh;
  x.fillStyle = '#F5E3CD'; x.fillRect(0, 0, W, H);
  rr(x, tx, ty, tw, th, 30); x.fillStyle = '#FFF8EE'; x.fill();
  x.save(); rr(x, tx, ty, tw, th, 30); x.clip(); x.fillStyle = '#FFD2CC'; x.fillRect(tx, cy, tw, sh); x.restore();
  rr(x, tx, ty, tw, th, 30); x.strokeStyle = '#D7A779'; x.lineWidth = 3; x.stroke();
  [tx, tx + tw].forEach(px => { x.beginPath(); x.arc(px, cy, 30, 0, 7); x.fillStyle = '#F5E3CD'; x.fill(); x.strokeStyle = '#D7A779'; x.stroke(); });
  x.fillStyle = '#F5E3CD'; x.fillRect(tx - 34, cy - 34, 34, 68); x.fillRect(tx + tw, cy - 34, 34, 68);
  x.setLineDash([14, 10]); x.strokeStyle = '#D7A779'; x.lineWidth = 3; x.beginPath(); x.moveTo(tx + 46, cy); x.lineTo(tx + tw - 46, cy); x.stroke(); x.setLineDash([]);
  const lw = 340, lh = lw * (img.naturalHeight || 310) / (img.naturalWidth || 550);
  x.drawImage(img, W / 2 - lw / 2, ty + 34, lw, lh);
  const campos = [['Nome', u.nome], ['WhatsApp', maskTel(u.tel)], ['Registrada em', fmtData(u.ts)]];
  let y = ty + 34 + lh + 40; const ix = tx + 56, iw = tw - 112;
  campos.forEach(([l, v]) => {
    x.textAlign = 'left'; x.fillStyle = '#7E5410'; x.font = '500 22px Poppins, sans-serif'; x.fillText(l, ix, y);
    x.fillStyle = '#381703'; ajustar(x, v, '500 #px Lora, serif', iw, 40, 24); x.fillText(v, ix, y + 46);
    x.strokeStyle = '#D7A779'; x.lineWidth = 2; x.beginPath(); x.moveTo(ix, y + 62); x.lineTo(ix + iw, y + 62); x.stroke();
    y += 108;
  });
  const multi = u.ns.length > 1, num = multi ? `${fmtN(u.ns[0])} a ${fmtN(u.ns[u.ns.length - 1])}` : fmtN(u.ns[0]);
  x.textAlign = 'center'; x.fillStyle = '#7E5410'; x.font = '500 24px Poppins, sans-serif';
  x.fillText(multi ? `${u.ns.length} fichas` : 'Sua ficha', W / 2, cy + 62);
  x.fillStyle = '#381703'; ajustar(x, num, '700 #px Lora, serif', iw, multi ? 84 : 120, 40); x.fillText(num, W / 2, cy + 172);
  x.fillStyle = '#7E5410'; x.font = '400 21px Poppins, sans-serif'; x.fillText('Doces Desejo’s · @doces.desejos_14', W / 2, cy + sh - 30);
  return c;
}

const cssUrl = v => (getComputedStyle(document.documentElement).getPropertyValue(v).match(/url\(["']?(.*?)["']?\)/) || [])[1];
const carregaImg = src => new Promise(res => { if (!src) return res(null); const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
function linhas(x, txt, max) {
  const out = []; let l = '';
  txt.split(' ').forEach(w => { const t = l ? l + ' ' + w : w; if (x.measureText(t).width > max && l) { out.push(l); l = w; } else l = t; });
  if (l) out.push(l); return out;
}
async function desenharFilipeta() {
  try { await Promise.all([document.fonts.load('700 60px Lora'), document.fonts.load('italic 500 40px Lora'), document.fonts.load('500 30px Poppins'), document.fonts.load('400 30px Poppins')]); } catch (e) {}
  const [logo, drip, sw] = await Promise.all([carregaImg(LOGO), carregaImg(cssUrl('--drip')), carregaImg(cssUrl('--swoosh'))]);
  const W = 920, H = 1280, u = W / 100, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), m = S.cfg.meta, cols = m <= 5 ? m : m <= 10 ? 5 : 6;

  y += 4 * u;

  const ls = linhas(x, filipetaTexto(), 80 * u), lhh = 5.8 * u * 1.22;
  ls.forEach((t, i) => x.fillText(t, W / 2, y + lhh * (i + .8))); y += lhh * ls.length + 3 * u;

      ['M4 8h16a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z', 'M12 8v13', 'M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7', 'M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5'].forEach(pt => x.stroke(new Path2D(pt)));
      x.restore();
    } else {
      x.fillStyle = '#FFFFFF'; x.fill(); x.setLineDash([12, 9]); x.strokeStyle = '#B0771C'; x.lineWidth = 4; x.stroke(); x.setLineDash([]);
      x.fillStyle = '#7E5410'; x.font = `700 ${d * .34}px Lora, serif`; x.textBaseline = 'middle'; x.fillText(String(i + 1), cx, cy + 2); x.textBaseline = 'alphabetic';
    }
